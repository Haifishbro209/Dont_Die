<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>health</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/health.css') }}">

</head>
<body>
    <div class="grid-bg"></div>
    
    <div class="container">
        <div class="form-container">
            <form id="health-form">                
                <div class="health-metrics">
                    <div class="form-group">
                        <label for="weight" >Weight (kg)</label>
                        <input type="number" id="weight" name="weight" placeholder="70" value="{{data['weight']}}">
                    </div>
                    
                    <div class="form-group">
                        <label for="height" >Height (cm)</label>
                        <input type="number" id="height" name="height" placeholder="175" value="{{data['height']}}" >
                    </div>
                    
                    <div class="form-group">
                        <label for="body-fat">Body Fat (%)</label>
                        <input type="number" id="body-fat" name="body-fat" placeholder="15" step="0.1" value="{{data['body_fat']}}">
                    </div>
                    
                    <div class="form-group">
                        <label for="systolic">Systolic BP (mmHg)</label>
                        <input type="number" id="systolic" name="systolic" placeholder="120" value="{{data['systolic']}}">
                    </div>
                    
                    <div class="form-group">
                        <label for="diastolic">Diastolic BP (mmHg)</label>
                        <input type="number" id="diastolic" name="diastolic" placeholder="80" value="{{data['diastolic']}}">
                    </div>
                    <div class="form-group">
                        <label for="resting-hr">Resting Heart Rate</label>
                        <input type="number" id="resting-hr" name="resting-hr" placeholder="65" value="{{data['resting_hr']}}">
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Save and analyse</button>
            </form>
        </div>
    </div>
    <script src="{{url_for('static', filename = 'js/health.js')}}"></script>
</body>
</html>
