<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Die App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

</head>
<body>
    <div class="header">
        <div class="logo-container">
            <div class="name">IVAN</div>
            <div class="nd">don't die</div>
        </div>
        <div class="score-container">
            <div class="score-label">Overall Vitality</div>
            <div class="score">87%</div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="grid-container">
            <div class="grid-item">
                <div class="icon-circle">
                    <div class="pulse"></div>
                    <div class="icon">85%</div>
                </div>
                <div class="label">SPORT</div>
                <div class="stats">+15% today</div>
                <div class="last-entry">Last: 30min jogging</div>
                <div class="chart-container">
                    <div class="chart-base-line"></div>
                    <div class="chart-line">
                        <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                            <defs>
                                <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="var(--primary-color)" stop-opacity="0.5" />
                                    <stop offset="100%" stop-color="var(--primary-color)" stop-opacity="0" />
                                </linearGradient>
                            </defs>
                            <path d="M0,30 L0,20 C5,23 10,10 15,12 C20,15 25,5 30,8 C35,11 40,13 45,10 C50,7 55,18 60,15 C65,12 70,10 75,5 C80,8 85,15 90,8 C95,5 100,10 100,7 L100,30 Z" fill="url(#gradient1)"></path>
                            <path class="chart-line-path" d="M0,20 C5,23 10,10 15,12 C20,15 25,5 30,8 C35,11 40,13 45,10 C50,7 55,18 60,15 C65,12 70,10 75,5 C80,8 85,15 90,8 C95,5 100,10 100,7" fill="none" stroke-dasharray="500" stroke-dashoffset="500" />

                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="grid-item">
                <div class="icon-circle">
                    <div class="pulse"></div>
                    <div class="icon">92%</div>
                </div>
                <div class="label">HEALTH</div>
                <div class="stats">+8% today</div>
                <div class="last-entry">Last: BP 118/75</div>
                <div class="chart-container">
                    <div class="chart-base-line"></div>
                    <div class="chart-line">
                        <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                            <defs>
                                <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="var(--primary-color)" stop-opacity="0.5" />
                                    <stop offset="100%" stop-color="var(--primary-color)" stop-opacity="0" />
                                </linearGradient>
                            </defs>
                            <path d="M0,30 L0,12 C5,10 10,15 15,11 C20,7 25,9 30,5 C35,3 40,7 45,9 C50,11 55,13 60,10 C65,7 70,5 75,3 C80,5 85,7 90,3 C95,5 100,8 100,4 L100,30 Z" fill="url(#gradient2)"></path>
                            <path class="chart-line-path" d="M0,12 C5,10 10,15 15,11 C20,7 25,9 30,5 C35,3 40,7 45,9 C50,11 55,13 60,10 C65,7 70,5 75,3 C80,5 85,7 90,3 C95,5 100,8 100,4" fill="none" stroke-dasharray="500" stroke-dashoffset="500" />
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="grid-item">
                <div class="icon-circle">
                    <div class="pulse"></div>
                    <div class="icon">78%</div>
                </div>
                <div class="label">SLEEP</div>
                <div class="stats">-3% today</div>
                <div class="last-entry">Last: 6h 42min</div>
                <div class="chart-container">
                    <div class="chart-base-line"></div>
                    <div class="chart-line">
                        <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                            <defs>
                                <linearGradient id="gradient3" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="var(--primary-color)" stop-opacity="0.5" />
                                    <stop offset="100%" stop-color="var(--primary-color)" stop-opacity="0" />
                                </linearGradient>
                            </defs>
                            <path d="M0,30 L0,15 C5,18 10,20 15,17 C20,14 25,16 30,18 C35,20 40,15 45,12 C50,13 55,16 60,15 C65,14 70,15 75,20 C80,17 85,13 90,15 C95,17 100,13 100,15 L100,30 Z" fill="url(#gradient3)"></path>
                            <path class="chart-line-path" d="M0,15 C5,18 10,20 15,17 C20,14 25,16 30,18 C35,20 40,15 45,12 C50,13 55,16 60,15 C65,14 70,15 75,20 C80,17 85,13 90,15 C95,17 100,13 100,15" fill="none" stroke-dasharray="500" stroke-dashoffset="500" />
                    
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="grid-item">
                <div class="icon-circle">
                    <div class="pulse"></div>
                    <div class="icon">93%</div>
                </div>
                <div class="label">NUTRITION</div>
                <div class="stats">+5% today</div>
                <div class="last-entry">Last: 2100 kcal</div>
                <div class="chart-container">
                    <div class="chart-base-line"></div>
                    <div class="chart-line">
                        <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                            <defs>
                                <linearGradient id="gradient4" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="var(--primary-color)" stop-opacity="0.5" />
                                    <stop offset="100%" stop-color="var(--primary-color)" stop-opacity="0" />
                                </linearGradient>
                            </defs>
                            <path d="M0,30 L0,18 C5,15 10,12 15,16 C20,18 25,14 30,12 C35,13 40,15 45,13 C50,10 55,12 60,14 C65,10 70,15 75,18 C80,20 85,15 90,12 C95,10 100,12 100,10 L100,30 Z" fill="url(#gradient4)"></path>
                            <path class="chart-line-path" d="M0,18 C5,15 10,12 15,16 C20,18 25,14 30,12 C35,13 40,15 45,13 C50,10 55,12 60,14 C65,10 70,15 75,18 C80,20 85,15 90,12 C95,10 100,12 100,10" fill="none" stroke-dasharray="500" stroke-dashoffset="500" />
                       
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="health-risks">
            <div class="risks-title">Health Risks & Recommendations</div>
            
            

        </div>
    </div>
    <script src="{{url_for('static', filename='js/app.js')}}"></script>
</body>
</html>
